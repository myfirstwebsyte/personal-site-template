name: Check site

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the locked build tools
        run: python -m pip install --upgrade uv

      - name: Install project dependencies
        run: uv sync --locked

      - name: Build the site and fail on warnings
        run: uv run pelican content -s publishconf.py --fatal warnings
