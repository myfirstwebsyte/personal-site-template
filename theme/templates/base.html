<!doctype html>
<html lang="{{ DEFAULT_LANG }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ SITESUBTITLE }}">
    <title>{% block title %}{{ SITENAME }}{% endblock title %}</title>
    <link rel="stylesheet" href="{{ SITEURL }}/theme/css/site.css">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <nav class="navigation" aria-label="Main navigation">
        <a class="site-name" href="{{ SITEURL }}/">{{ SITENAME }}</a>
        <div class="nav-links">
          <a href="{{ SITEURL }}/">Writing</a>
          {% for page in pages|sort(attribute='title') %}
          <a href="{{ SITEURL }}/{{ page.url }}">{{ page.title }}</a>
          {% endfor %}
          <a href="{{ SITEURL }}/archive/">Archive</a>
        </div>
      </nav>
    </header>

    <main id="content">
      {% block content %}{% endblock content %}
    </main>

    <footer class="site-footer">
      <p>Made slowly with words, Markdown, and care.</p>
    </footer>
  </body>
</html>
